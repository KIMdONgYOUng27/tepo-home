<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>테포 사운드 미리 듣기</title><style>body{max-width:800px;margin:35px auto;padding:0 22px;background:#f5e9cd;color:#435548;font:15px/1.7 sans-serif}h1{font-size:25px}audio{width:100%;margin:10px 0 20px}button{border:1px solid #a6ab87;border-radius:8px;background:#fff9e9;color:#435548;padding:9px 14px;cursor:pointer;text-align:left;font:inherit}#sounds{display:grid;grid-template-columns:1fr 1fr;gap:10px}button[aria-pressed=true]{background:#d4dfc6}small{color:#7d785d}@media(max-width:550px){#sounds{grid-template-columns:1fr}}</style><h1>테포 사운드 미리 듣기</h1><p>메인 브금과 재질별 효과음 모음이에요. 효과음은 한 번에 하나씩 재생돼요.</p><h2>메인 브금</h2><audio controls preload="metadata" src="assets/audio/tepo-main-v1.mp3"></audio><h2>효과음 · v40</h2><p>사이트 효과음 55% 기준 음량이에요. 서랍은 나무 레일의 드르륵, 문은 경첩의 끼이익 소리로 교체했어요.</p><p id="current" role="status">아래에서 소리를 골라 주세요.</p><audio id="sample" controls preload="none"></audio><section id="sounds"></section><p><a href="index.html">← 지도로 돌아가기</a></p><script>
const music=document.querySelector('audio'),sample=document.querySelector('#sample');music.onplay=()=>sample.pause();sample.onplay=()=>music.pause();
fetch('assets/audio/sound-bank-v40.json').then(r=>r.json()).then(bank=>Object.entries(bank.sounds).forEach(([name,s])=>{const b=document.createElement('button');b.textContent=s.label+' · '+s.seconds.toFixed(2)+'초';b.setAttribute('aria-pressed','false');b.onclick=()=>{document.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));document.querySelector('#current').textContent=s.label;sample.src=s.src;sample.volume=Math.min(1,s.gain*.55);sample.play();};document.querySelector('#sounds').append(b);}));
</script></html>
