<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eddfba">
  <meta name="description" content="부산 바닷가에 사는 테포와 엘펭이의 작은 세계.">
  <title>테포의 부산 · TEPO</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main>
    <section class="map-shell" aria-label="테포의 부산 탐험 지도">
      <h1 class="sr-only">테포의 부산</h1>
      <div id="map-viewport" class="map-viewport" aria-label="부산 지도">
        <div id="map-scene" class="map-scene">
          <picture class="map-picture"><img class="map-background" src="assets/busan-parchment-clean-v2.png" alt="종이 위에 먹선과 수채화로 그린 테포의 부산 탐험 지도. 오락실, 팝업, 포토존, 등대와 수상한 모래굴이 해안 길을 따라 연결되어 있습니다." width="1672" height="941" draggable="false"></picture>
          <button class="destination destination-arcade" data-place="arcade" aria-label="오락실" type="button"><span class="place-sprite sprite-arcade" aria-hidden="true"></span></button>
          <button class="destination destination-popup" data-place="popup" aria-label="팝업" type="button"><span class="place-sprite sprite-popup" aria-hidden="true"></span></button>
          <button class="destination destination-photo" data-place="photo" aria-label="포토존" type="button"><span class="place-sprite sprite-photo" aria-hidden="true"></span></button>
          <button class="destination destination-home" data-place="home" aria-label="테포의 집" type="button"><span class="place-sprite sprite-home" aria-hidden="true"></span></button>
          <button class="destination destination-mystery" data-place="mystery" aria-label="수상한 모래굴" type="button"><span class="place-sprite sprite-mystery" aria-hidden="true"></span></button>
        </div>
      </div>
      <div id="map-loading" class="map-loading" role="status" aria-label="지도 불러오는 중"><span class="loading-spinner" aria-hidden="true"></span></div>
    </section>
  </main>
</body>
</html>
