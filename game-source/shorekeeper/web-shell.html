<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>$GODOT_PROJECT_NAME</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: white;
	background-color: #f3e6c6;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
 position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 34%,#fff9e8,#f3e6c6);color:#334637;
 font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;text-align:center;
 padding:20px;box-sizing:border-box;overflow:auto;
}
.loading-card {width:min(440px,100%);padding:20px;box-sizing:border-box}
.loading-label {font-size:12px;letter-spacing:.24em;color:#778060;margin:0 0 8px}
.loading-art {height:clamp(100px,30vh,230px);display:flex;justify-content:center;margin:14px 0}
#status-splash {display:block;width:100%;height:100%;object-fit:contain;animation:tepo-float 2.8s ease-in-out infinite}
.loading-title {font-size:clamp(23px,4vw,32px);margin:0 0 10px;letter-spacing:-.06em}
#loading-caption {font-size:14px;margin:0 0 18px;line-height:1.6;word-break:keep-all;color:#637052}
#status-progress {display:block;width:100%;height:14px;border:2px solid #6b7152;border-radius:12px;overflow:hidden;background:#e4d7b3;accent-color:#628a76;box-sizing:border-box}
#status-progress::-webkit-progress-bar {background:#e4d7b3}
#status-progress::-webkit-progress-value {background:linear-gradient(90deg,#779e86,#426d62);border-radius:8px;transition:width .2s}
#status-progress::-moz-progress-bar {background:#628a76;border-radius:8px}
#loading-percent {font-size:13px;margin:8px 0 0;font-variant-numeric:tabular-nums;color:#637052;min-height:20px}
#status-notice {display:none;margin-top:16px;border:1px solid #ab7863;border-radius:10px;background:#fff5e6;color:#713f32;padding:14px;font-size:13px;line-height:1.6;overflow-wrap:anywhere}
@keyframes tepo-float {0%,100% {transform:translateY(0) rotate(-1deg)}50% {transform:translateY(-8px) rotate(1deg)}}
@media (orientation:landscape) and (max-height:500px) {.loading-card{padding:4px}.loading-art{height:100px;margin:6px 0}.loading-label{margin-bottom:4px}.loading-title{font-size:23px;margin-bottom:6px}#loading-caption{margin-bottom:10px}}
@media (prefers-reduced-motion:reduce) {#status-splash{animation:none}}

#tepo-rotate {display:none;position:fixed;inset:0;background:#faf0d8;color:#334637;z-index:30;text-align:center;align-items:center;justify-content:center;flex-direction:column;gap:18px;font-family:system-ui,sans-serif;padding:24px;box-sizing:border-box}
#tepo-fullscreen {position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));z-index:25;border:2px solid #6b7152;border-radius:9px;background:#faf0d8dc;color:#334637;padding:8px 12px;font-size:14px;cursor:pointer}
#tepo-rotate strong {font-size:24px} #tepo-rotate span {line-height:1.7;max-width:320px;word-break:keep-all}
@media (orientation:portrait) and (pointer:coarse) {#tepo-rotate {display:flex} #tepo-fullscreen {z-index:35}}
@media (orientation:landscape) and (max-height:500px) {#tepo-fullscreen {font-size:12px;padding:5px 9px;opacity:.65}}
</style>
		$GODOT_HEAD_INCLUDE
	</head>
	<body>
<div id="tepo-rotate" role="status"><strong>휴대폰을 가로로 돌려주세요</strong><span>테포의 바다는 가로 화면으로 플레이해요.<br>가로로 돌린 뒤 게임을 계속할 수 있어요.</span></div>
<button id="tepo-fullscreen" type="button" aria-label="게임 전체화면">전체화면</button>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<section class="loading-card" aria-labelledby="loading-title">
                <p class="loading-label">TEPO · SHOREKEEPER</p>
                <div class="loading-art"><img id="status-splash" src="loading/tepo.png" alt="뚝배기 모자를 쓴 테포" width="1280" height="1280" fetchpriority="high"></div>
                <h1 id="loading-title" class="loading-title">테포 · 파도를 지켜라</h1>
                <p id="loading-caption" role="status" aria-live="polite">테포가 바다로 나갈 준비를 하고 있어요.</p>
                <progress id="status-progress" aria-label="게임 다운로드 진행률"></progress>
                <p id="loading-percent">바다를 불러오는 중…</p>
                <div id="status-notice" role="alert"></div>
            </section>
		</div>

		<script src="web-ranking.js?v=14"></script>
		<script src="web-music.js?v=14"></script>
		<script src="$GODOT_URL"></script>
		<script>
const GODOT_CONFIG = $GODOT_CONFIG;
GODOT_CONFIG.mainPack = 'index-v0.15.pck';
GODOT_CONFIG.fileSizes['index-v0.15.pck'] = GODOT_CONFIG.fileSizes['index.pck'];
const GODOT_THREADS_ENABLED = $GODOT_THREADS_ENABLED;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const loadingPercent = document.getElementById('loading-percent');
	const loadingCaption = document.getElementById('loading-caption');

	let initializing = true;
	let statusMode = '';

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		if (mode === 'notice') {
			loadingCaption.textContent = '바다에 연결하지 못했어요. 새로고침 후 다시 시도해 주세요.';
			loadingPercent.textContent = '';
		}
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
					const percent = Math.min(100, Math.floor(current / total * 100));
					loadingPercent.textContent = percent < 100 ? `바다를 불러오는 중 · ${percent}%` : '준비한 것들을 펼치는 중…';
					if (percent === 100) loadingCaption.textContent = '곧 테포와 함께 출발해요.';
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
					loadingPercent.textContent = '바다를 불러오는 중…';
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	<script>
const tepoCanvas=document.getElementById('canvas');
const fullButton=document.getElementById('tepo-fullscreen');
fullButton.addEventListener('click',async()=>{
 try {
  if(document.fullscreenElement) await document.exitFullscreen();
  else {
   await document.documentElement.requestFullscreen();
   try {await screen.orientation.lock('landscape');} catch (_) {}
  }
 } catch (_) {fullButton.textContent='가로 화면으로 플레이';}
 tepoCanvas.focus();
});
document.addEventListener('fullscreenchange',()=>{fullButton.textContent=document.fullscreenElement?'전체화면 닫기':'전체화면';});
document.addEventListener('keydown',event=>{
 if(document.activeElement===tepoCanvas && ['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(event.key))event.preventDefault();
});
</script>
</body>
</html>
